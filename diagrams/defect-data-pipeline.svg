<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220">
  <style>
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; ry: 10; }
    .title { font: 14px Arial, sans-serif; fill: #111827; }
    .arrow { stroke: #374151; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <rect class="box" x="20" y="60" width="160" height="80" />
  <text class="title" x="40" y="95">Raw Defect</text>
  <text class="title" x="55" y="115">Records</text>

  <rect class="box" x="210" y="60" width="140" height="80" />
  <text class="title" x="250" y="105">S3</text>

  <rect class="box" x="380" y="60" width="170" height="80" />
  <text class="title" x="420" y="95">EMR</text>
  <text class="title" x="405" y="115">PySpark Jobs</text>

  <rect class="box" x="580" y="60" width="170" height="80" />
  <text class="title" x="610" y="95">Curated</text>
  <text class="title" x="600" y="115">Dataset</text>

  <rect class="box" x="760" y="60" width="140" height="80" />
  <text class="title" x="785" y="105">QuickSight</text>

  <line class="arrow" x1="180" y1="100" x2="210" y2="100" />
  <line class="arrow" x1="350" y1="100" x2="380" y2="100" />
  <line class="arrow" x1="550" y1="100" x2="580" y2="100" />
  <line class="arrow" x1="750" y1="100" x2="760" y2="100" />
</svg>
