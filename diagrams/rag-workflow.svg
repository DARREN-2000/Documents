<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
  <style>
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; ry: 10; }
    .title { font: 14px Arial, sans-serif; fill: #111827; }
    .arrow { stroke: #374151; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <rect class="box" x="30" y="30" width="180" height="70" />
  <text class="title" x="60" y="65">Internal Documents</text>

  <rect class="box" x="30" y="130" width="180" height="70" />
  <text class="title" x="70" y="160">Chunking &</text>
  <text class="title" x="75" y="180">Cleaning</text>

  <rect class="box" x="30" y="230" width="180" height="70" />
  <text class="title" x="70" y="265">Embeddings</text>

  <rect class="box" x="290" y="230" width="180" height="70" />
  <text class="title" x="340" y="265">Vector Index</text>

  <rect class="box" x="290" y="30" width="180" height="70" />
  <text class="title" x="330" y="65">User Query</text>

  <rect class="box" x="290" y="130" width="180" height="70" />
  <text class="title" x="330" y="165">Retriever</text>

  <rect class="box" x="550" y="130" width="220" height="70" />
  <text class="title" x="600" y="160">Context Assembly</text>

  <rect class="box" x="550" y="230" width="220" height="70" />
  <text class="title" x="620" y="265">LLM Response</text>

  <line class="arrow" x1="120" y1="100" x2="120" y2="130" />
  <line class="arrow" x1="120" y1="200" x2="120" y2="230" />
  <line class="arrow" x1="210" y1="265" x2="290" y2="265" />
  <line class="arrow" x1="380" y1="100" x2="380" y2="130" />
  <line class="arrow" x1="380" y1="200" x2="380" y2="230" />
  <line class="arrow" x1="470" y1="165" x2="550" y2="165" />
  <line class="arrow" x1="660" y1="200" x2="660" y2="230" />
</svg>
